x-common-healthcheck: &hc
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:8320/api/healthz"]
    interval: 3600s
    timeout: 5s
    start_period: 10s
    retries: 3

x-common-logging: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: ["gpu"]

services:
  api:
    image: roki-ai-image-embedding:local
    container_name: roki-imageembedding
    environment:
      # Set NACOS_ENV=test to use test; unset or empty defaults to prod.
      NACOS_ENV: ${NACOS_ENV:-test}
      # 本地 compose 联调：api 经服务名访问
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-image_embeddings}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-1024}
      QDRANT_DISTANCE: ${QDRANT_DISTANCE:-Cosine}
      # PG v0.1 M2: PostgreSQL metadata (replaces MySQL)
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-image_emb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-image_emb}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-image_embedding}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://image_emb:image_emb@postgres:5432/image_embedding}
      # PG v0.1 M4: object storage (mock by default; no secrets in repo)
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-image-embedding}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-https://cdn.example.local/image-embedding}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ENV: ${S3_ACCESS_KEY_ENV:-S3_ACCESS_KEY_ID}
      S3_SECRET_KEY_ENV: ${S3_SECRET_KEY_ENV:-S3_SECRET_ACCESS_KEY}
      S3_USE_BOTO3: ${S3_USE_BOTO3:-0}
      S3_MOCK_MIRROR_DIR: ${S3_MOCK_MIRROR_DIR:-}
    volumes:
      - ./save_images:/app/save_imagesoutput
      - ./output:/app/output
    ports:
      - "8320:8320"
    depends_on:
      - qdrant
      - postgres
    <<: [*hc, *logs, *gpu]
    restart: unless-stopped

  # 本地开发：向量库（图搜图）
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: roki-imageembedding-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *logs
    restart: unless-stopped

  # 本地开发：元数据 PostgreSQL + ltree（PG v0.1；空库重建，无 MySQL）
  postgres:
    image: postgres:16
    container_name: roki-imageembedding-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-image_emb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-image_emb}
      POSTGRES_DB: ${POSTGRES_DATABASE:-image_embedding}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    <<: *logs
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
