x-common-healthcheck: &hc
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:8320/api/healthz"]
    interval: 30s
    timeout: 5s
    start_period: 180s
    retries: 5

x-common-logging: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: ["gpu"]

services:
  api:
    image: roki-ai-image-embedding:local
    container_name: roki-imageembedding
    environment:
      # Set NACOS_ENV=test to use test; unset or empty defaults to prod.
      NACOS_ENV: ${NACOS_ENV:-test}
      # Local compose stack talks to sibling postgres/qdrant via the entrypoint
      # (it rewrites hosts from the mounted Windows config.yaml). Keep Nacos
      # off unless you explicitly want it to overlay connection settings.
      NACOS_ENABLED: ${NACOS_ENABLED:-false}
    volumes:
      - ./save_images:/app/save_imagesoutput
      - ./output:/app/output
      - ./config/param/config.yaml:/opt/host-config.yaml:ro
      - ./docker-entrypoint-compose.sh:/opt/entrypoint-compose.sh:ro
    ports:
      - "8320:8320"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/entrypoint-compose.sh"]
    <<: [*hc, *logs, *gpu]
    restart: unless-stopped

  # 本地开发：向量库（图搜图）
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: roki-imageembedding-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *logs
    restart: unless-stopped

  # 本地开发：元数据 PostgreSQL + ltree（PG v0.1；空库重建，无 MySQL）
  postgres:
    image: postgres:16
    container_name: roki-imageembedding-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-image_emb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-image_emb}
      POSTGRES_DB: ${POSTGRES_DATABASE:-image_embedding}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    <<: *logs
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data: