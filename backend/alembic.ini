# Alembic config - Image-Embedding PG v0.1 (M2)
# Run from backend/:  alembic upgrade head
# The database is POSTGRES_CONFIG from Nacos / config/param/config.yaml, the same as
# the application (see alembic/env.py). Do not put sqlalchemy.url here.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
