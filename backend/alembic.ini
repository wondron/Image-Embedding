# Alembic config - Image-Embedding PG v0.1 (M2)
# Run from backend/:  alembic upgrade head
# DATABASE_URL or POSTGRES_* env vars (see PostgresSettings)

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Overridden at runtime by alembic/env.py from DATABASE_URL / PostgresSettings
sqlalchemy.url = postgresql+psycopg://image_emb:image_emb@localhost:5432/image_embedding

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
